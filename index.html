<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#344D68">
  <meta name="description" content="Időzseton – Interaktív keresztyén etikai önismereti játék, 24 órával és két időkerékkel XI. osztályos diákoknak.">
  <title>Időzseton – Mire költöd az életedet?</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Application CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#app" class="skip-link">Ugrás a fő tartalomhoz</a>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="header-inner">
        <button class="logo-area" id="header-logo-btn" data-action="home" aria-label="Időzseton főoldal">
          <div class="logo-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="app-title-header">IDŐZSETON</span>
            <span class="app-subtitle-header">Keresztyén Etikai Önismereti Játék</span>
          </div>
        </button>

        <div class="header-meta">
          <span class="subject-badge">Református vallás – XI. osztály</span>
        </div>
      </div>

      <!-- Steps Navigation -->
      <div class="step-bar-container">
        <nav class="steps-nav" id="steps-nav" aria-label="Játék lépések"></nav>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="app" class="app-main" aria-live="polite" tabindex="-1"></main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-inner">
        <span>24 óra • Egy átlagos iskolai nap • A te döntéseid</span>
        <span>Helyben működő alkalmazás · Nincs adatgyűjtés és regisztráció · <a href="sources.html" target="_blank" rel="noopener">Felhasznált források</a></span>
      </div>
    </footer>
  </div>

  <script src="js/result-sheet.js"></script>
  <script src="js/pdf-export.js"></script>
  <script>
    'use strict';

    // 12 Functional Time Categories
    const CATEGORIES = [
      { id: 'school', name: 'Iskola / munkahely', group: 'red', color: '#344D68', symbol: 'I' },
      { id: 'travel', name: 'Utazás', group: 'red', color: '#A45D32', symbol: 'U' },
      { id: 'duty', name: 'Egyéb kötelesség', group: 'red', color: '#4C5F30', symbol: 'K' },
      { id: 'sleep', name: 'Alvás', group: 'green', color: '#795878', symbol: 'A' },
      { id: 'study', name: 'Tanulás', group: 'green', color: '#56748A', symbol: 'T' },
      { id: 'phone', name: 'Telefon / internet', group: 'green', color: '#834525', symbol: 'N' },
      { id: 'family', name: 'Család', group: 'green', color: '#687B42', symbol: 'C' },
      { id: 'friends', name: 'Barátok', group: 'green', color: '#53384F', symbol: 'B' },
      { id: 'sport', name: 'Sport / hobbi', group: 'green', color: '#263C53', symbol: 'S' },
      { id: 'faith', name: 'Hit / elcsendesedés', group: 'green', color: '#A66640', symbol: 'H' },
      { id: 'rest', name: 'Pihenés / szórakozás', group: 'green', color: '#806B31', symbol: 'P' },
      { id: 'other', name: 'Egyéb', group: 'green', color: '#8A6488', symbol: 'E' }
    ];

    const categoryMap = Object.fromEntries(CATEGORIES.map(x => [x.id, x]));

    // Global State
    const state = {
      page: 0,
      reached: 0,
      selected: 'school',
      unlockRed: false,
      real: Array.from({ length: 24 }, (_, id) => ({ id, cat: null, source: null, origin: null })),
      ideal: null,
      notice: '',
      commitment: ''
    };

    const $ = id => document.getElementById(id);

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    const tokens = () => (state.page === 2 ? state.ideal : state.real);
    const count = (list, id) => list.filter(t => t.cat === id).length;
    const countFree = list => list.filter(t => !t.cat).length;

    // A comparison and its export are valid only when BOTH days contain 24 assigned hours.
    function hasCompleteDay(list) {
      return Array.isArray(list) && list.length === 24 &&
             Array.from(list).every(t => t && typeof t.cat === 'string' &&
               Object.prototype.hasOwnProperty.call(categoryMap, t.cat));
    }

    function hasCompleteDays() {
      return hasCompleteDay(state.real) && hasCompleteDay(state.ideal);
    }

    function requireCompleteDays() {
      if (hasCompleteDays()) return true;

      // If no ideal plan exists, the real-day step must be completed first.
      const needsRealStep = !hasCompleteDay(state.real) || !Array.isArray(state.ideal);
      state.page = needsRealStep ? 1 : 2;
      state.selected = needsRealStep ? 'school' : 'sleep';
      state.notice = 'Az összehasonlításhoz és a letöltéshez mindkét nap mind a 24 óráját ki kell osztanod.';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return false;
    }

    const stolen = list => list.filter(t => t.source === 'red' && t.cat && categoryMap[t.cat].group === 'green').length;

    function prepareIdeal() {
      state.ideal = state.real.map(t => ({
        id: t.id,
        cat: categoryMap[t.cat].group === 'red' ? t.cat : null,
        source: categoryMap[t.cat].group,
        origin: t.cat
      }));
      state.unlockRed = false;
      state.selected = 'sleep';
    }

    function invalidateIdeal() {
      if (state.page === 1 && state.ideal) {
        state.ideal = null;
        state.reached = 1;
      }
    }

    function addToken(id) {
      const cat = categoryMap[id];
      const list = tokens();
      if (!cat) return;

      if (state.page === 2 && cat.group === 'red' && !state.unlockRed) {
        state.notice = 'A piros idő alapból kötött. Előbb kapcsold be a módosítást.';
        render();
        return;
      }

      const free = list.filter(t => !t.cat);
      if (!free.length) {
        state.notice = 'Minden időzsetont kiosztottál. Ha módosítanál, előbb vegyél vissza egyet.';
        render();
        return;
      }

      let pick = state.page === 2 ? free.find(t => t.source === cat.group) || free[0] : free[0];
      pick.cat = id;
      invalidateIdeal();
      state.notice = '';
      render();
    }

    function removeToken(id, tokenId = null) {
      const cat = categoryMap[id];
      const list = tokens();
      if (!cat) return;

      if (state.page === 2 && cat.group === 'red' && !state.unlockRed) {
        state.notice = 'A piros idő rögzített. A módosításhoz előbb oldd fel.';
        render();
        return;
      }

      const matches = list.filter(t => t.cat === id);
      let pick = tokenId === null ? matches[matches.length - 1] : matches.find(t => t.id === tokenId);
      if (!pick) return;

      pick.cat = null;
      invalidateIdeal();
      state.notice = '';
      render();
    }

    function setPage(page) {
      if (page > state.reached) return;
      if (page === 3 && !requireCompleteDays()) return;
      state.page = page;
      state.selected = page === 2 ? 'sleep' : 'school';
      state.notice = '';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function advance(page) {
      if (page === 3 && !requireCompleteDays()) return;
      state.reached = Math.max(state.reached, page);
      setPage(page);
    }

    function renderStepsNav() {
      const labels = ['Címlap', 'Valóság', 'Ideális', 'Összevetés'];
      const nav = $('steps-nav');
      if (!nav) return;

      nav.innerHTML = labels.map((label, i) => {
        const isActive = state.page === i;
        const isDone = i < state.reached;
        const isDisabled = i > state.reached || (i === 3 && !hasCompleteDays());
        return `
          ${i > 0 ? `<div class="step-divider ${i <= state.reached ? 'active' : ''}"></div>` : ''}
          <button class="step-item ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}"
                  data-page="${i}"
                  ${isDisabled ? 'disabled' : ''}
                  aria-label="${i + 1}. lépés: ${label}"
                  ${isActive ? 'aria-current="step"' : ''}>
            <span class="step-badge">${i + 1}</span>
            <span class="step-label">${label}</span>
          </button>
        `;
      }).join('');
    }

    function arcPath(cx, cy, rIn, rOut, angleStart, angleEnd) {
      const p = (r, a) => ({
        x: cx + r * Math.cos(a * Math.PI / 180),
        y: cy + r * Math.sin(a * Math.PI / 180)
      });
      const a = p(rOut, angleStart);
      const b = p(rOut, angleEnd);
      const c = p(rIn, angleEnd);
      const d = p(rIn, angleStart);
      return `M ${a.x.toFixed(3)} ${a.y.toFixed(3)} A ${rOut} ${rOut} 0 0 1 ${b.x.toFixed(3)} ${b.y.toFixed(3)} L ${c.x.toFixed(3)} ${c.y.toFixed(3)} A ${rIn} ${rIn} 0 0 0 ${d.x.toFixed(3)} ${d.y.toFixed(3)} Z`;
    }

    function wheelSvg(list, description) {
      const ordered = [...CATEGORIES.flatMap(c => list.filter(t => t.cat === c.id)), ...list.filter(t => !t.cat)];
      let paths = ordered.map((t, i) => {
        let a = -90 + i * 15, b = a + 15;
        let isStolen = t.source === 'red' && t.cat && categoryMap[t.cat].group === 'green';
        let fill = t.cat ? categoryMap[t.cat].color : 'var(--color-empty-token)';
        let label = t.cat ? `${categoryMap[t.cat].name} – ${isStolen ? 'kötött időből átcsoportosítva' : '1 óra'}` : 'Még nincs kiosztva';
        return `
          <g class="wheel-slice ${t.cat ? 'group-' + categoryMap[t.cat].group : ''}">
            <title>${escapeHtml(label)}</title>
            <path class="wheel-segment" d="${arcPath(170, 170, 70, 148, a, b)}" fill="${fill}"/>
            ${t.cat && categoryMap[t.cat].group === 'red' ? `<path class="wheel-bound-mark" d="${arcPath(170, 170, 137, 146, a + 1.2, b - 1.2)}"/>` : ''}
            ${isStolen ? `<path class="wheel-stolen-mark" d="${arcPath(170, 170, 133, 146, a + 1.2, b - 1.2)}"/>` : ''}
            <text class="wheel-hour ${t.cat ? 'assigned' : ''}"
                  x="${(170 + (t.cat ? 88 : 109) * Math.cos((a + b) / 2 * Math.PI / 180)).toFixed(2)}"
                  y="${(173 + (t.cat ? 88 : 109) * Math.sin((a + b) / 2 * Math.PI / 180)).toFixed(2)}"
                  text-anchor="middle">${i + 1}</text>
            ${t.cat ? `<text class="wheel-letter" aria-hidden="true"
                  x="${(170 + 116 * Math.cos((a + b) / 2 * Math.PI / 180)).toFixed(2)}"
                  y="${(174 + 116 * Math.sin((a + b) / 2 * Math.PI / 180)).toFixed(2)}"
                  text-anchor="middle">${categoryMap[t.cat].symbol}</text>` : ''}
          </g>
        `;
      }).join('');
      let used = 24 - countFree(list);
      return `
        <svg viewBox="0 0 340 340" role="img" aria-label="${escapeHtml(description)}. ${used} a 24 órából kiosztva.">
          <circle cx="170" cy="170" r="153" fill="none" stroke="var(--color-border)" stroke-width="1"/>
          ${paths}
          <circle cx="170" cy="170" r="66" fill="var(--color-header-bg)" stroke="var(--color-header-sub)" stroke-width="2"/>
          <text x="170" y="164" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="46" font-weight="700" fill="var(--color-header-sub)">24</text>
          <text x="170" y="188" text-anchor="middle" font-size="11" letter-spacing="2" font-weight="700" fill="#FFFFFF">ÓRA</text>
        </svg>
      `;
    }

    function introCoins() {
      return Array.from({ length: 24 }, (_, i) => {
        const a = (i * 15 - 90) * Math.PI / 180;
        const x = Math.cos(a) * 150;
        const y = Math.sin(a) * 150;
        return `<div class="hero-orbit-coin" style="--x:${x.toFixed(2)}px;--y:${y.toFixed(2)}px">${i + 1}</div>`;
      }).join('');
    }

    function renderIntro() {
      return `
        <section class="hero-card">
          <div class="hero-text-content">
            <span class="hero-badge">Interaktív keresztyén etikai játék · XI. osztály</span>
            <h1 class="hero-title">IDŐZSETON</h1>
            <h2 class="hero-subtitle">Mire költöd az életedet?</h2>
            <p class="hero-lead">Minden iskolai napod 24 órából áll. Egy részéről mások döntenek, a többit te osztod be. De vajon az időd tényleg azt mutatja, ami fontos neked?</p>
            <p class="hero-subtext">Két időkerék. Egy őszinte összehasonlítás. Saját következtetések.</p>
            <div class="actions-row">
              <button class="btn btn-primary" data-action="start">
                Induljon a játék <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>
          <div class="hero-visual-container">
            <div class="hero-halo"></div>
            ${introCoins()}
            <div class="hero-center-badge">
              <span class="num">24</span>
              <span class="lbl">Időzseton</span>
            </div>
          </div>
        </section>
      `;
    }

    function categoryRow(c, list) {
      let n = count(list, c.id);
      let locked = state.page === 2 && c.group === 'red' && !state.unlockRed;
      return `
        <div class="cat-card ${state.selected === c.id ? 'selected' : ''} ${locked ? 'locked' : ''}">
          <button class="cat-select-btn" data-select="${c.id}" aria-pressed="${state.selected === c.id}" title="${escapeHtml(c.name)} kiválasztása">
            <span class="cat-swatch group-${c.group}" style="--color:${c.color}" aria-hidden="true">${c.symbol}</span>
            <span class="cat-name-text">${escapeHtml(c.name)}</span>
          </button>
          <div class="cat-controls">
            <button class="btn-counter" data-dec="${c.id}" ${locked || n === 0 ? 'disabled' : ''} aria-label="${escapeHtml(c.name)}: egy óra elvétele">−</button>
            <span class="counter-num">${n}</span>
            <button class="btn-counter" data-inc="${c.id}" ${locked || countFree(list) === 0 ? 'disabled' : ''} aria-label="${escapeHtml(c.name)}: egy óra hozzáadása">+</button>
          </div>
        </div>
      `;
    }

    function coinGrid(list) {
      return list.map((t, i) => {
        let cat = t.cat ? categoryMap[t.cat] : null;
        let ss = t.source === 'red' && cat && cat.group === 'green';
        let locked = state.page === 2 && cat && cat.group === 'red' && !state.unlockRed;
        return `
          <button class="coin-btn ${cat ? 'assigned group-' + cat.group : ''} ${ss ? 'stolen' : ''} ${locked ? 'locked' : ''}"
                  data-token="${i}"
                  style="--c:${cat ? cat.color : 'var(--color-empty-token)'}"
                  title="${cat ? escapeHtml(cat.name) + (ss ? ' – kötött időből' : '') : 'Szabad időzseton – add a kiválasztott kategóriához'}"
                  aria-label="${i + 1}. zseton: ${cat ? escapeHtml(cat.name) : 'szabad'}${ss ? ', eredetileg kötött idő' : ''}">
            ${cat ? cat.symbol : i + 1}
          </button>
        `;
      }).join('');
    }

    function legend(list) {
      return CATEGORIES.filter(c => count(list, c.id) > 0).map(c => `
        <div class="legend-row">
          <span class="legend-left">
            <span class="cat-swatch group-${c.group}" style="--color:${c.color}" aria-hidden="true">${c.symbol}</span>
            ${escapeHtml(c.name)}
          </span>
          <strong>${count(list, c.id)} ó</strong>
        </div>
      `).join('');
    }

    function renderWorkbench() {
      let ideal = state.page === 2;
      let list = tokens();
      let free = countFree(list);
      let used = 24 - free;
      let st = ideal ? stolen(list) : 0;

      const title = ideal ? 'Az én ideális iskolai napom' : 'A valóság – így telik egy iskolai napom';
      const subtitle = ideal
        ? 'A piros, kötött időt áthoztuk a valós napodból. A zöld időt szabadon újratervezheted; szükség esetén a piros is feloldható.'
        : 'Gondolj egy átlagos tanítási napra! Nem hétvégére vagy szünetre. Előbb a kötött időt, majd a többi órát oszd be a valós szokásaid szerint.';

      let lockBox = ideal ? `
        <div class="lockbar-card">
          <div>
            <strong>🔒 Kötött idő átvéve</strong>
            <p>A piros zsetonok alapból rögzítve vannak, de módosíthatók.</p>
          </div>
          <label class="toggle-switch">
            <input id="unlock" type="checkbox" ${state.unlockRed ? 'checked' : ''}> Feloldom
          </label>
        </div>
        ${state.unlockRed ? `
          <div class="pastel-card warning">
            <div class="eyebrow-mini">Módszertani jelzés</div>
            <p>A pirosból a zöld kategóriákba kerülő zsetonokat a játék „lopott időként” külön jelöli. A „lopott idő” a játék szemléltető elnevezése; nem automatikus erkölcsi ítélet.</p>
          </div>
        ` : ''}
      ` : '';

      let notice = state.notice ? `
        <div class="pastel-card warning" role="status">
          <p>${escapeHtml(state.notice)}</p>
        </div>
      ` : '';

      return `
        <section>
          <div class="screen-header">
            <div>
              <div class="screen-eyebrow">${ideal ? 'Második időkerék' : 'Első időkerék'}</div>
              <h1 class="screen-title">${title}</h1>
              <p class="screen-subtitle">${subtitle}</p>
            </div>
            <div class="stage-badge">${ideal ? 'Újratervezés' : 'Valóság'} · 24 óra</div>
          </div>

          <div class="workbench-grid">
            <div class="panel-card">
              <h2 class="panel-title">Oszd ki a zsetonokat!</h2>
              <p class="panel-desc">Válassz kategóriát, majd nyomj + jelet vagy egy szabad zsetont.</p>

              <div class="budget-box ${free === 0 ? 'complete' : 'warning'}">
                <span class="budget-num">${free}</span>
                <div class="budget-info">
                  <strong>${free === 0 ? 'Minden óra a helyére került' : 'Még kiosztható zseton'}</strong>
                  <span>${used}/24 zseton kiosztva · minden zseton egy óra</span>
                </div>
              </div>

              ${lockBox}

              <div class="cat-group-label red-group">
                <span>🔴 Piros · Kötött idő</span>
              </div>
              <div class="category-grid">
                ${CATEGORIES.filter(c => c.group === 'red').map(c => categoryRow(c, list)).join('')}
              </div>

              <div class="cat-group-label green-group">
                <span>🟢 Zöld · Beosztható idő</span>
              </div>
              <div class="category-grid">
                ${CATEGORIES.filter(c => c.group === 'green').map(c => categoryRow(c, list)).join('')}
              </div>

              <p class="source-citation" style="margin-top:1rem;">A zöld szín nem azt jelenti, hogy a tevékenység elhagyható: az alvás például alapvető szükséglet. A szín azt mutatja, mekkora mozgástered van az időtartam megválasztásában.</p>

              ${notice}

              <div class="actions-row">
                <button class="btn btn-secondary" data-action="back">← Vissza</button>
                <button class="btn btn-primary" data-action="finish" ${free ? 'disabled' : ''}>
                  ${ideal ? 'Kérek összehasonlítást' : 'Elkészült az időkerékem'} <span aria-hidden="true">→</span>
                </button>
              </div>
            </div>

            <aside class="panel-card sticky-panel">
              <div class="screen-eyebrow">${ideal ? 'Ideális időkerék' : 'Valós időkerék'}</div>
              <h2 class="panel-title">24 szelet · 24 óra</h2>
              <div class="wheel-holder">
                ${wheelSvg(list, ideal ? 'Ideális időkerék' : 'Valós időkerék')}
              </div>
              <p style="text-align:center; font-size:0.85rem; color:var(--color-text-muted);">
                ${free ? `${free} üres szelet vár még egy zsetonra` : 'Készen van a 24 szeletes időkerék!'}
              </p>

              <div class="cat-group-label" style="border:none; margin-top:1rem;">A 24 zsetonod</div>
              <p style="font-size:0.8rem; color:var(--color-text-muted); margin-bottom:0.5rem;">Kattints egy arany zsetonra: a kijelölt kategóriába kerül. A kitöltöttekre kattintva visszaveheted őket.</p>
              <div class="coin-grid">${coinGrid(list)}</div>

              ${ideal && st ? `
                <div class="pastel-card warning" style="margin-top:0.85rem;">
                  <strong>${st} „lopott” zseton</strong>
                  <p style="font-size:0.82rem; margin-top:0.2rem;">Ennyi eredetileg piros órát osztottál át zöld tevékenységre. Ezeket piros szegély jelöli.</p>
                </div>
              ` : ''}

              <div class="cat-group-label" style="border:none; margin-top:1rem;">Jelmagyarázat</div>
              <div class="legend-grid">
                ${legend(list) || '<p class="source-citation">Még nincs kiosztott idő.</p>'}
              </div>
              <div class="source-citation group-key" style="margin-top:0.85rem; border-top:1px solid var(--color-border); padding-top:0.5rem;">
                <span><i class="group-key-mark bound" aria-hidden="true"></i>Piros = kötött idő</span> ·
                <span><i class="group-key-mark free" aria-hidden="true"></i>Zöld = beosztható idő</span> ·
                <span><i class="group-key-mark transferred" aria-hidden="true"></i>Piros szegélyű zöld = kötött időből átcsoportosítva.</span>
              </div>
            </aside>
          </div>
        </section>
      `;
    }

    function diffText(d) {
      return d > 0 ? `+${d} ó` : d < 0 ? `${d} ó` : '–';
    }

    function comparisonRows() {
      return CATEGORIES.map(c => {
        let a = count(state.real, c.id);
        let b = count(state.ideal, c.id);
        let delta = b - a;
        return `
          <div class="comparison-row">
            <div class="comp-name">
              <span class="cat-swatch group-${c.group}" style="--color:${c.color}" aria-hidden="true">${c.symbol}</span>
              ${escapeHtml(c.name)}
            </div>
            <div class="comp-bars">
              <div class="bar-track-row">
                <span>Most</span>
                <div class="bar-track-bg">
                  <div class="bar-fill-elem" style="width:${100 * a / 12}%; --c:${c.color}"></div>
                </div>
              </div>
              <div class="bar-track-row">
                <span>Terv</span>
                <div class="bar-track-bg">
                  <div class="bar-fill-elem ideal-fill" style="width:${100 * b / 12}%; --c:${c.color}"></div>
                </div>
              </div>
            </div>
            <div class="comp-delta ${delta > 0 ? 'plus' : delta < 0 ? 'minus' : ''}">${diffText(delta)}</div>
          </div>
        `;
      }).join('');
    }

    // Exact biblical and ethical reflections from main branch index.html
    function getInsights() {
      const real = state.real, ideal = state.ideal, items = [];
      const d = id => count(ideal, id) - count(real, id);
      const st = stolen(ideal);

      if (st > 0) {
        items.push({
          type: 'guidance',
          tag: 'Szabadság és felelősség',
          title: `${st} kötött órát más célra fordítanál`,
          verse: 'Ef 5,15–16 · 1Kor 10,23–24',
          body: 'Ezek a zsetonok a valóságban kötelezettséghez tartoztak. Az átcsoportosítás oka számít: egy valóban megváltozott helyzet nem ugyanaz, mint egy vállalt feladat elkerülése. Kit érintene a döntésed, és milyen következményekkel járhatna?',
          question: 'Ha ezt a változtatást holnap megtennéd, kivel kellene előbb egyeztetned?',
          source: 'XI. református tanterv, 10. és 18. PDF-old.; Napjaink etikai kihívásai, 18–19. o.'
        });
      }

      if (d('sleep') > 0) {
        items.push({
          type: 'verse',
          tag: 'Pihenés és feltöltődés',
          title: `${d('sleep')} órával több alvást tervezel`,
          verse: '2Móz 20,8–11 · Mk 2,27',
          body: 'Az alvást a tankönyv a passzív rekreáció példájaként említi. A munka és a pihenés egészséges váltakozása fontos; a pihenés nem pusztán a megmaradó idő kitöltése.',
          question: 'Melyik jelenlegi elfoglaltságodból tudnád ezt az időt reálisan felszabadítani?',
          source: 'Napjaink etikai kihívásai, 15. és 17–18. o.'
        });
      } else if (d('sleep') < 0) {
        items.push({
          type: 'verse',
          tag: 'A pihenés helye',
          title: `${Math.abs(d('sleep'))} órával kevesebb alvást tervezel`,
          verse: '2Móz 20,8–11 · Mk 2,27',
          body: 'Az alvás idejét szabadabban osztod be, de a pihenés alapvető emberi szükséglet. A tankönyv hangsúlyozza, hogy a tartós pihenéshiány kimerüléshez vezethet. A játék nem szab meg „helyes” alvásóraszámot.',
          question: 'A felszabadított idő nyeresége arányban állhat azzal, amit a pihenésből elveszel?',
          source: 'Napjaink etikai kihívásai, 15., 17–18. o.'
        });
      }

      if (d('phone') !== 0) {
        items.push({
          type: 'reflection',
          tag: 'Digitális szokások és önuralom',
          title: d('phone') < 0 ? `${Math.abs(d('phone'))} órával kevesebb képernyőidőt választanál` : `${d('phone')} órával több képernyőidőt választanál`,
          verse: '1Kor 6,12',
          body: 'A digitális eszközök tanulásra, kapcsolattartásra és szórakozásra is szolgálnak. A hosszú képernyőidő önmagában nem bizonyít függőséget; a cél, a következmények és az önkontroll a lényeg. A „Csak még öt perc!” történet azt mutatja meg, hogyan szoríthatja háttérbe a késő esti görgetés az alvást.',
          question: 'Te választod meg, mikor fejezed be, vagy nehéz abbahagyni?',
          source: 'Keresztyén etika a digitális világban – LIVRESQ-forrásanyag, 2–3. PDF-old.; Digitális Lelkiismeret, 33–37. PDF-old.'
        });
      }

      if (d('family') !== 0 || d('friends') !== 0) {
        items.push({
          type: 'verse',
          tag: 'Kapcsolatok és felebaráti felelősség',
          title: (d('family') + d('friends')) > 0 ? 'Több időt szánnál a kapcsolataidra' : 'A kapcsolatokra szánt idődet is átrendeznéd',
          verse: '1Kor 10,23–24 · Mt 22,39',
          body: 'A keresztyén szabadság nemcsak azt vizsgálja, nekem mi jó, hanem a másik ember javát is. A tankönyv a stabil emberi kapcsolatokat az egészséges életmód részeként említi. Az óraszám önmagában nem mutatja meg egy kapcsolat minőségét.',
          question: 'Ki az, akire szeretnél tudatosabban figyelni a következő iskolai napon?',
          source: 'Napjaink etikai kihívásai, 19. o.; XI. református tanterv, 17–18. PDF-old.'
        });
      }

      if (d('rest') !== 0 || d('sport') !== 0) {
        items.push({
          type: 'guidance',
          tag: 'Rekreáció és kiegyensúlyozottság',
          title: 'Más arányban osztanád be a kikapcsolódást',
          verse: '2Móz 20,8–11 · Mk 2,27',
          body: 'A rekreációnak több formája van: mozgás, játék, művelődés, kikapcsolódás és nyugalom. A tankönyv szerint az a fontos, hogy valóban feltöltsön, és ne ártson neked vagy másoknak.',
          question: 'Az általad választott időtöltés után inkább feltöltődsz, vagy még fáradtabbnak érzed magad?',
          source: 'Napjaink etikai kihívásai, 14–19. o.; Napjaink etikai kihívásai – Tanári segédanyag, 6. PDF-old.'
        });
      }

      if (d('study') !== 0) {
        items.push({
          type: 'verse',
          tag: 'Tanulás és a tevékenységek egyensúlya',
          title: d('study') > 0 ? `${d('study')} órával több tanulást tervezel` : `${Math.abs(d('study'))} órával kevesebb tanulást tervezel`,
          verse: 'Ef 5,15–16 · Kol 3,17',
          body: 'A munka és a tanulás nem pusztán kényszer; ugyanakkor a túlzott teljesítményre törekvés a pihenés rovására mehet. A tanári segédanyag külön hangsúlyozza a munka és szabadidő egyensúlyát.',
          question: 'Mi segítene abban, hogy a feladataidra és a pihenésre is jusson hely?',
          source: 'Napjaink etikai kihívásai – Tanári segédanyag, 6–7. PDF-old.; XI. református tanterv, 18. PDF-old.'
        });
      }

      if (d('faith') !== 0) {
        items.push({
          type: 'verse',
          tag: 'Hit és elcsendesedés',
          title: d('faith') > 0 ? 'Több időt hagynál a hitnek és az elcsendesedésnek' : 'Átgondolnád az elcsendesedés helyét',
          verse: 'Zsolt 23 · Zsolt 25 · Ef 5,15–16',
          body: 'A XI. osztályos tanterv az Istenben való megpihenést és a döntésekhez kért vezetést is megjeleníti. Az időkerék a ráfordított órákat mutatja, de önmagában nem alkalmas a hit vagy az Istennel való kapcsolat értékelésére.',
          question: 'Hogyan lehetne az imádság vagy a csend a mindennapi döntéseid része?',
          source: 'XI. református tanterv, 10. és 17–18. PDF-old.'
        });
      }

      if (d('other') !== 0) {
        items.push({
          type: 'reflection',
          tag: 'Ami nem fér bele a kategóriákba',
          title: 'Az „egyéb” időd is változna',
          verse: 'Ef 5,15–16',
          body: 'Az időkerék nem tudja helyetted megmondani, mi tartozik az „egyéb” kategóriába. Az életkörülmények és a családi elvárások sokfélék; ugyanannyi óra két embernél egészen mást jelenthet.',
          question: 'Mi található valójában az „egyéb” óráid mögött?',
          source: 'Napjaink etikai kihívásai, 15. o.; Tanári segédanyag, 8. PDF-old.'
        });
      }

      if (!items.length) {
        items.push({
          type: 'guidance',
          tag: 'Önismeret és felelős döntés',
          title: 'A két napodban nincs nagy változás',
          verse: 'Ef 5,15–16 · 1Kor 6,12',
          body: 'A két időkerék önmagában nem ad erkölcsi osztályzatot. A tanári segédanyag arra hív, hogy a tevékenységeinket összefüggéseikben nézzük, és ne egy szabálylistából induljunk ki.',
          question: 'Mi az az egy szokásod, amelyet most is szívesen megtartanál, és miért?',
          source: 'Napjaink etikai kihívásai – Tanári segédanyag, 6–9. PDF-old.'
        });
      }

      return items;
    }

    function renderInsightsCards() {
      const items = getInsights();
      const card = x => `
        <article class="pastel-card ${x.type || 'guidance'}">
          <div class="eyebrow-mini">${escapeHtml(x.tag)}</div>
          <h3>${escapeHtml(x.title)}</h3>
          <span class="scripture-tag">Bibliai iránytű: ${escapeHtml(x.verse)}</span>
          <p>${escapeHtml(x.body)}</p>
          <div class="reflection-question"><strong>Kérdés:</strong> ${escapeHtml(x.question)}</div>
          <div class="source-citation"><strong>Forrás:</strong> ${escapeHtml(x.source)}</div>
        </article>
      `;

      const first = items.slice(0, 3).map(card).join('');
      const rest = items.slice(3);
      return first + (rest.length ? `
        <details class="details-accordion">
          <summary>További ${rest.length} személyes felismerés és forrás</summary>
          ${rest.map(card).join('')}
        </details>
      ` : '');
    }

    function renderResults() {
      let diff = CATEGORIES.filter(c => count(state.real, c.id) !== count(state.ideal, c.id)).length;
      let st = stolen(state.ideal);
      let gains = CATEGORIES.filter(c => count(state.ideal, c.id) > count(state.real, c.id))
                            .reduce((sum, c) => sum + count(state.ideal, c.id) - count(state.real, c.id), 0);

      return `
        <section>
          <div class="screen-header">
            <div>
              <div class="screen-eyebrow">Negyedik képernyő · Önreflexió</div>
              <h1 class="screen-title">Mit mutat a két napod?</h1>
              <p class="screen-subtitle">Itt nem jegyet kapsz. Az időkerék nem minősít téged: azt segít megérteni, hol van valódi mozgástered és milyen következményei lehetnek a döntéseidnek.</p>
            </div>
            <div class="stage-badge">Összehasonlítás</div>
          </div>

          <div class="panel-card" style="margin-bottom: 1.5rem;">
            <div class="wheels-comparison-container">
              <div class="wheel-card-box">
                <h3>A valós iskolai napom</h3>
                <div class="wheel-holder">${wheelSvg(state.real, 'Valós iskolai nap')}</div>
              </div>
              <div class="wheel-card-box">
                <h3>Az én ideális iskolai napom</h3>
                <div class="wheel-holder">${wheelSvg(state.ideal, 'Ideális iskolai nap')}</div>
              </div>
            </div>

            <div class="summary-stats-grid">
              <div class="stat-card">
                <span class="num">${diff}</span>
                <span class="label">módosult kategória</span>
              </div>
              <div class="stat-card">
                <span class="num">${gains}</span>
                <span class="label">átcsoportosított óra</span>
              </div>
              <div class="stat-card">
                <span class="num">${st}</span>
                <span class="label">átcsoportosított kötött idő</span>
              </div>
            </div>
          </div>

          <div class="results-grid">
            <div>
              <div class="panel-card">
                <h2 class="panel-title">Óráról órára</h2>
                <p class="panel-desc">A valós és a tervezett nap különbsége kategóriánként.</p>

                <div class="comparison-list">
                  ${comparisonRows()}
                </div>

                <div class="pastel-card ${st ? 'warning' : 'good'}" style="margin-top:1.25rem;">
                  ${st ? `
                    <strong>${st} kötött órát áthelyeztél.</strong>
                    <p>A változtatás eredetét külön jeleztük, mert nem mindegy, milyen kötelezettség rovására történik a pihenés vagy a szórakozás.</p>
                  ` : `
                    <strong>Nem vettél el időt a piros kötelezettségeidből.</strong>
                    <p>A változtatásaid a szabadabban beosztható időn belül maradtak.</p>
                  `}
                </div>
              </div>

              <div class="panel-card commitment-box">
                <h2 class="panel-title">A saját döntésem</h2>
                <p class="panel-desc">Nem muszáj egyetlen zsetont áthelyezned: annyi órát tervezhetsz át, amennyit reálisnak tartasz. Írd le, mit és hogyan szeretnél megváltoztatni!</p>

                <label for="commitment">Mit próbálsz ki a következő iskolai napon?</label>
                <textarea id="commitment" placeholder="Például: Kevesebbet görgetek este, és korábban lefekszem.">${escapeHtml(state.commitment)}</textarea>

                <div class="export-actions" aria-label="Eredménylap letöltése">
                  <button class="btn btn-primary" data-action="download-png" data-export-format="png">Eredménylap letöltése képként (PNG)</button>
                  <div class="export-secondary-actions">
                    <button class="btn btn-secondary" data-action="download-pdf" data-export-format="pdf">PDF letöltése</button>
                    <button class="btn btn-secondary" data-action="download" data-export-format="txt">Részletes szöveges eredmény (TXT)</button>
                  </div>
                  <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
                </div>
                <div class="actions-row">
                  <button class="btn btn-secondary" data-action="back">← Ideális nap módosítása</button>
                  <button class="btn btn-warning btn-sm" data-action="reset">Újrakezdés</button>
                </div>
                <p class="source-citation" style="margin-top:0.75rem;">A letöltés helyben készül. Az adataidat a weboldal nem küldi el sehova.</p>
              </div>
            </div>

            <aside class="panel-card">
              <div class="screen-eyebrow">Személyes felismerések</div>
              <h2 class="panel-title">Bibliai iránytű</h2>
              <p class="panel-desc">A visszajelzések a két időbeosztás eltéréseire épülnek. A bibliaszövegeket a feltöltött források hivatkozásai alapján jelöljük; nincsenek erkölcsi ponthatárok.</p>

              <div>
                ${renderInsightsCards()}
              </div>

              <div class="pastel-card verse" style="margin-top: 1rem;">
                <div class="eyebrow-mini">Igei útravaló</div>
                <p><strong>Az idő bölcs és felelős felhasználása</strong></p>
                <div class="scripture-tag">Ef 5,15–16 · XI. osztályos tantervi igehely</div>
              </div>
            </aside>
          </div>
        </section>
      `;
    }

    function render() {
      // Defensive check: never render a stale result if the token allocation changed.
      if (state.page === 3 && !hasCompleteDays()) {
        requireCompleteDays();
        return;
      }
      renderStepsNav();
      const app = $('app');
      if (!app) return;
      app.innerHTML = state.page === 0 ? renderIntro() : state.page === 3 ? renderResults() : renderWorkbench();
    }

    // One detached snapshot feeds every export; live allocations are never changed.
    function createResultSnapshot() {
      const commitment = $('commitment');
      if (commitment) state.commitment = commitment.value;
      const copyTokens = list => Object.freeze(list.map(t => Object.freeze({ ...t })));
      return Object.freeze({
        categories: Object.freeze(CATEGORIES.map(c => Object.freeze({
          ...c, real: count(state.real, c.id), ideal: count(state.ideal, c.id),
          delta: count(state.ideal, c.id) - count(state.real, c.id)
        }))),
        realTokens: copyTokens(state.real),
        idealTokens: copyTokens(state.ideal),
        commitment: state.commitment,
        insights: Object.freeze(getInsights().map(it => Object.freeze({ ...it })))
      });
    }

    function resultText(snapshot = createResultSnapshot()) {
      let a = [
        'IDŐZSETON – Mire költöd az életedet?',
        'Egy átlagos iskolai nap – személyes összehasonlítás',
        '',
        'Kategória | Valóság | Ideális | Eltérés'
      ];
      for (let c of snapshot.categories) {
        let r = c.real;
        let i = c.ideal;
        a.push(`${c.name} | ${r} ó | ${i} ó | ${i - r >= 0 ? '+' : ''}${i - r} ó`);
      }
      a.push('', 'Kötött időből átcsoportosítva: ' + stolen(snapshot.idealTokens) + ' óra', '', 'Forrásalapú reflexiók:');
      for (const it of snapshot.insights) {
        a.push('', it.title, 'Igehely: ' + it.verse, it.body, 'Önreflexió: ' + it.question);
      }
      a.push('', 'Személyes vállalás:', snapshot.commitment.trim() || '(nincs megadva)', '', 'A két időkerék nem erkölcsi osztályzat.');
      return a.join('\n');
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      try {
        a.click();
      } finally {
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      }
    }

    let exportInProgress = false;

    function setExportStatus(message, failed = false) {
      const status = $('export-status');
      if (!status) return;
      status.textContent = message;
      status.className = 'export-status' + (failed ? ' export-error' : '');
    }

    function setExportBusy(busy) {
      document.querySelectorAll('[data-export-format]').forEach(button => {
        button.disabled = busy;
      });
      const status = $('export-status');
      if (status) status.setAttribute('aria-busy', String(busy));
    }

    function downloadText() {
      if (!requireCompleteDays() || exportInProgress) return;
      try {
        const snapshot = createResultSnapshot();
        const blob = new Blob(['\ufeff' + resultText(snapshot)], { type: 'text/plain;charset=utf-8' });
        downloadBlob(blob, 'idozseton-szemelyes-eredmeny.txt');
        setExportStatus('A részletes szöveges eredmény letöltése elkészült.');
      } catch (error) {
        setExportStatus('Nem sikerült elkészíteni a szöveges eredményt. Kérjük, próbáld újra.', true);
      }
    }

    async function downloadVisual(format) {
      if (!requireCompleteDays() || exportInProgress) return;
      let pages = [];
      try {
        exportInProgress = true;
        setExportBusy(true);
        setExportStatus('Az eredménylap készül…');
        const snapshot = createResultSnapshot();
        if (!window.ResultSheet || (format === 'pdf' && !window.PDFExport)) {
          throw new Error('Az exportáláshoz szükséges fájl nem töltődött be. Frissítsd az oldalt, vagy válaszd a TXT-formátumot.');
        }
        pages = await window.ResultSheet.renderPages(snapshot);
        const blob = format === 'png'
          ? await window.ResultSheet.toPNG(pages)
          : await window.PDFExport.fromCanvases(pages);
        // Navigation may have changed the live plan during rendering.
        if (!requireCompleteDays()) return;
        downloadBlob(blob, 'Idozseton_szemelyes_eredmeny.' + format);
        setExportStatus('Az eredménylap letöltése elkészült (' + format.toUpperCase() + ').');
      } catch (error) {
        setExportStatus('Nem sikerült elkészíteni az eredménylapot. ' + (error.message || 'Próbáld újra, vagy válaszd a TXT-formátumot.'), true);
      } finally {
        pages.forEach(canvas => { canvas.width = 0; canvas.height = 0; });
        exportInProgress = false;
        setExportBusy(false);
      }
    }

    document.addEventListener('click', event => {
      const btn = event.target.closest('[data-action],[data-inc],[data-dec],[data-token],[data-select],[data-page]');
      if (!btn) return;

      if (btn.dataset.page !== undefined) {
        setPage(Number(btn.dataset.page));
        return;
      }
      if (btn.dataset.select) {
        state.selected = btn.dataset.select;
        state.notice = '';
        render();
        return;
      }
      if (btn.dataset.inc) {
        addToken(btn.dataset.inc);
        return;
      }
      if (btn.dataset.dec) {
        removeToken(btn.dataset.dec);
        return;
      }
      if (btn.dataset.token !== undefined) {
        let t = tokens()[Number(btn.dataset.token)];
        if (!t) return;
        if (t.cat) removeToken(t.cat, t.id);
        else addToken(state.selected);
        return;
      }

      switch (btn.dataset.action) {
        case 'home':
          setPage(0);
          break;
        case 'start':
          advance(1);
          break;
        case 'back':
          setPage(state.page - 1);
          break;
        case 'finish':
          if (countFree(tokens())) {
            state.notice = 'Előbb oszd ki mind a 24 zsetont.';
            render();
            return;
          }
          if (state.page === 1) {
            prepareIdeal();
            advance(2);
          } else if (state.page === 2) {
            advance(3);
          }
          break;
        case 'download':
          downloadText();
          break;
        case 'download-png':
          downloadVisual('png');
          break;
        case 'download-pdf':
          downloadVisual('pdf');
          break;
        case 'reset':
          if (confirm('Újrakezded a játékot? A jelenlegi zsetonbeosztások elvesznek.')) {
            state.page = 0;
            state.reached = 0;
            state.selected = 'school';
            state.unlockRed = false;
            state.notice = '';
            state.commitment = '';
            state.ideal = null;
            state.real = Array.from({ length: 24 }, (_, id) => ({ id, cat: null, source: null, origin: null }));
            render();
            window.scrollTo(0, 0);
          }
          break;
      }
    });

    document.addEventListener('change', event => {
      if (event.target.id === 'unlock') {
        state.unlockRed = event.target.checked;
        state.notice = '';
        render();
      }
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'commitment') {
        state.commitment = event.target.value;
      }
    });

    // Initialize
    render();
  </script>
</body>
</html>
